name: Build TWRP 14.1 A20

on:
  workflow_dispatch:

jobs:
  build:
    name: TWRP 14.1 A20
    runs-on: ubuntu-24.04

    steps:

      # ─────────────────────────────
      # Checkout Device Tree
      # ─────────────────────────────
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      # ─────────────────────────────
      # Free Disk Space
      # ─────────────────────────────
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo docker system prune -af || true

          df -h

      # ─────────────────────────────
      # Install Dependencies
      # ─────────────────────────────
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            repo \
            python3 \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            g++-multilib \
            gcc-multilib \
            gnupg \
            libc6-dev-i386 \
            lib32z1-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev

      # ─────────────────────────────
      # Install Latest Repo
      # ─────────────────────────────
      - name: Install Latest Repo
        run: |
          mkdir -p "$HOME/bin"

          curl https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      # ─────────────────────────────
      # Git Configuration
      # ─────────────────────────────
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # ─────────────────────────────
      # Initialize TWRP 14.1
      # ─────────────────────────────
      - name: Initialize TWRP 14.1
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"

          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1 \
            --git-lfs

      # ─────────────────────────────
      # Sync TWRP 14.1
      # ─────────────────────────────
      - name: Sync TWRP 14.1
        working-directory: ${{ github.workspace }}/twrp
        run: |
          repo sync \
            -c \
            -j$(nproc --all) \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      # ─────────────────────────────
      # Add A20 Device Tree
      # ─────────────────────────────
      - name: Add A20 Device Tree
        run: |
          mkdir -p twrp/device/samsung/a20

          find . \
            -maxdepth 1 \
            ! -name "." \
            ! -name "twrp" \
            ! -name ".git" \
            ! -name ".github" \
            -exec cp -a {} twrp/device/samsung/a20/ \;

      - name: Patch Device Tree for TWRP 14.1
        working-directory: ${{ github.workspace }}/twrp
        run: |
          echo "Patching A20 Device Tree for TWRP 14.1..."

          # Remove obsolete lunch definitions
          cat > device/samsung/a20/vendorsetup.sh <<'EOF'
          #
          # Copyright (C) 2026 The Android Open Source Project
          # Copyright (C) 2026 SebaUbuntu's TWRP device tree generator
          #
          # SPDX-License-Identifier: Apache-2.0
          #
          EOF

          # Use the Android 14.1 lunch format
          cat > device/samsung/a20/AndroidProducts.mk <<'EOF'
          #
          # Copyright (C) 2026 The Android Open Source Project
          # Copyright (C) 2026 SebaUbuntu's TWRP device tree generator
          #
          # SPDX-License-Identifier: Apache-2.0
          #

          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_a20.mk

          COMMON_LUNCH_CHOICES := \
              twrp_a20-ap2a-eng \
              twrp_a20-ap2a-userdebug \
              twrp_a20-ap2a-user
          EOF

          echo
          echo "========== PATCHED AndroidProducts.mk =========="
          cat device/samsung/a20/AndroidProducts.mk

          echo
          echo "========== PATCHED vendorsetup.sh =========="
          cat device/samsung/a20/vendorsetup.sh

      # ─────────────────────────────
      # Setup Build Environment
      # ─────────────────────────────

      - name: Setup Build
        working-directory: ${{ github.workspace }}/twrp
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_a20-ap2a-eng

      # ─────────────────────────────
      # Build Recovery
      # ─────────────────────────────

      - name: Build TWRP
        working-directory: ${{ github.workspace }}/twrp
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_a20-ap2a-eng
          mka recoveryimage -j$(nproc --all)

      # ─────────────────────────────
      # Check Output
      # ─────────────────────────────
      - name: Check Build Output
        working-directory: ${{ github.workspace }}/twrp
        run: |
          echo "================================"
          echo "TWRP 14.1 BUILD OUTPUT"
          echo "================================"

          ls -lh out/target/product/a20/ || true

          echo
          echo "Recovery images:"

          find out/target/product/a20 \
            -type f \
            \( \
              -name "recovery.img" \
              -o -name "recovery*.img" \
              -o -name "*.zip" \
            \) \
            -print

      # ─────────────────────────────
      # Upload Recovery
      # ─────────────────────────────
      - name: Upload TWRP 14.1
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-14.1-A20
          path: |
            twrp/out/target/product/a20/recovery.img
            twrp/out/target/product/a20/*.zip
          if-no-files-found: warn



